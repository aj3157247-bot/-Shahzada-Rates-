name: Auto Update Rates

on:
  schedule:
    - cron: '0 6 * * *' # هر روز ساعت ۶ صبح به وقت گرینویچ اجرا می‌شود
  workflow_dispatch:

jobs:
  update-rates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run script
        run: python update_rates.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-update exchange and gold rates"
          branch: main
