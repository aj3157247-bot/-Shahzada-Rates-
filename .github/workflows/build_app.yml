name: Build Android APK & Update Data

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *' # اجرای خودکار هر ۶ ساعت یک‌بار
  workflow_dispatch:

# مجوز دسترسی جهت ثبت و پُش تغییرات به ریپوزیتوری
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Update Exchange Rates JSON
      run: python scripts/fetch_rates.py

    - name: Commit updated JSON
      run: |
        git config --global user.name 'GitHub Action Bot'
        git config --global user.email 'action@github.com'
        git add assets/rates.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update exchange rates" && git push)

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.x'

    - name: Generate Android Project Files
      run: flutter create . --project-name=shahzada_rates --platforms=android --org=com.afghanrate.app

    - name: Install Dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: afghan-exchange-apk
        path: build/app/outputs/flutter-apk/app-release.apk
